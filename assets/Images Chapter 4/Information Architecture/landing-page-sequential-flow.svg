<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
  <rect width="1400" height="500" fill="#FFFFFF"/>
  <text x="70" y="65" font-family="Poppins,Arial" font-size="34" font-weight="700" fill="#102A43">Recorrido secuencial del visitante</text>
  <text x="70" y="102" font-family="Inter,Arial" font-size="18" fill="#486581">La narrativa conduce desde el reconocimiento del problema hasta el contacto comercial.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#829AB1"/></marker></defs>
  <g stroke="#829AB1" stroke-width="4" marker-end="url(#arrow)"><line x1="255" y1="270" x2="315" y2="270"/><line x1="475" y1="270" x2="535" y2="270"/><line x1="695" y1="270" x2="755" y2="270"/><line x1="915" y1="270" x2="975" y2="270"/><line x1="1135" y1="270" x2="1195" y2="270"/></g>
  <g font-family="Poppins,Arial" text-anchor="middle" font-size="16" font-weight="600">
    <g><circle cx="175" cy="270" r="80" fill="#0B4F8A"/><text x="175" y="260" fill="#FFFFFF">Conocer</text><text x="175" y="285" fill="#FFFFFF">Molinex</text></g>
    <g><circle cx="395" cy="270" r="80" fill="#EAF4FB" stroke="#0B4F8A"/><text x="395" y="260" fill="#102A43">Comprender</text><text x="395" y="285" fill="#102A43">el problema</text></g>
    <g><circle cx="615" cy="270" r="80" fill="#EAF4FB" stroke="#0B4F8A"/><text x="615" y="260" fill="#102A43">Revisar</text><text x="615" y="285" fill="#102A43">funciones</text></g>
    <g><circle cx="835" cy="270" r="80" fill="#EEF7E8" stroke="#4F8A2B"/><text x="835" y="260" fill="#102A43">Identificar</text><text x="835" y="285" fill="#102A43">su rol</text></g>
    <g><circle cx="1055" cy="270" r="80" fill="#FFF7D6" stroke="#A86F00"/><text x="1055" y="260" fill="#102A43">Comparar</text><text x="1055" y="285" fill="#102A43">planes</text></g>
    <g><circle cx="1275" cy="270" r="80" fill="#073763"/><text x="1275" y="260" fill="#FFFFFF">Solicitar</text><text x="1275" y="285" fill="#FFFFFF">información</text></g>
  </g>
  <text x="70" y="455" font-family="Inter,Arial" font-size="15" fill="#486581">Fuente: elaboración propia.</text>
</svg>
