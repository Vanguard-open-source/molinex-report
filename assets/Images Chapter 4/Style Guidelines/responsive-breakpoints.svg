<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#F5F7FA"/>
  <text x="60" y="70" font-family="Poppins,Arial" font-size="34" font-weight="700" fill="#102A43">Diseño web responsive</text>
  <text x="60" y="108" font-family="Inter,Arial" font-size="18" fill="#486581">Un solo producto web que adapta su estructura según el ancho del navegador.</text>
  <g stroke="#0B4F8A" stroke-width="6" fill="#FFFFFF">
    <rect x="85" y="180" width="145" height="245" rx="18"/><rect x="310" y="165" width="230" height="260" rx="14"/><rect x="625" y="205" width="290" height="190" rx="9"/><rect x="975" y="170" width="170" height="225" rx="8"/>
  </g>
  <g font-family="Inter,Arial" text-anchor="middle" fill="#102A43">
    <text x="157" y="465" font-size="17" font-weight="700">Móvil</text><text x="157" y="490" font-size="15">Base &lt; 768 px</text>
    <text x="425" y="465" font-size="17" font-weight="700">Tablet</text><text x="425" y="490" font-size="15">≥ 768 px</text>
    <text x="770" y="465" font-size="17" font-weight="700">Laptop</text><text x="770" y="490" font-size="15">≥ 1024 px</text>
    <text x="1060" y="465" font-size="17" font-weight="700">Desktop</text><text x="1060" y="490" font-size="15">≥ 1280 px</text>
  </g>
  <g fill="#EAF4FB"><rect x="105" y="210" width="105" height="30" rx="5"/><rect x="105" y="258" width="105" height="110" rx="7"/><rect x="335" y="195" width="180" height="30" rx="5"/><rect x="335" y="245" width="80" height="135" rx="7"/><rect x="430" y="245" width="85" height="135" rx="7"/><rect x="650" y="230" width="240" height="25" rx="5"/><rect x="650" y="275" width="110" height="80" rx="7"/><rect x="775" y="275" width="115" height="80" rx="7"/><rect x="995" y="198" width="130" height="25" rx="5"/><rect x="995" y="243" width="130" height="105" rx="7"/></g>
</svg>
