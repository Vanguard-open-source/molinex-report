<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="60" y="70" font-family="Poppins,Arial" font-size="34" font-weight="700" fill="#102A43">Sistema tipográfico</text>
  <text x="60" y="108" font-family="Inter,Arial" font-size="18" fill="#486581">Poppins establece la jerarquía; Inter optimiza la lectura de información operativa.</text>
  <g fill="#102A43">
    <text x="60" y="190" font-family="Poppins,Arial" font-size="48" font-weight="700">H1 · Eficiencia para cada proceso</text>
    <text x="60" y="255" font-family="Poppins,Arial" font-size="36" font-weight="600">H2 · Control de producción</text>
    <text x="60" y="310" font-family="Poppins,Arial" font-size="28" font-weight="600">H3 · Indicadores de rendimiento</text>
    <text x="60" y="360" font-family="Poppins,Arial" font-size="22" font-weight="600">H4 · Estado de maquinaria</text>
    <text x="60" y="425" font-family="Inter,Arial" font-size="18" font-weight="600">Texto destacado · Rendimiento del lote: 82 %</text>
    <text x="60" y="468" font-family="Inter,Arial" font-size="16">Texto base · Consulta datos de producción, calidad y mantenimiento.</text>
    <text x="60" y="508" font-family="Inter,Arial" font-size="14" fill="#486581">Texto auxiliar · Última actualización: hoy, 10:30</text>
  </g>
  <rect x="60" y="565" width="205" height="54" rx="10" fill="#F2B705"/><text x="162" y="599" text-anchor="middle" font-family="Poppins,Arial" font-size="15" font-weight="600" fill="#073763">Solicitar información</text>
  <rect x="290" y="565" width="180" height="54" rx="10" fill="#0B4F8A"/><text x="380" y="599" text-anchor="middle" font-family="Poppins,Arial" font-size="15" font-weight="600" fill="#FFFFFF">Ver indicadores</text>
  <text x="60" y="675" font-family="Inter,Arial" font-size="16" fill="#486581">Tamaño base: 16 px · Párrafos: interlineado 1.6 · Escala adaptable mediante clamp()</text>
