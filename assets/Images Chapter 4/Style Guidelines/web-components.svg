    <rect x="490" y="160" width="190" height="52" rx="10" fill="#FFFFFF" stroke="#0B4F8A" stroke-width="2"/><text x="585" y="193" text-anchor="middle" fill="#0B4F8A">Botón terciario</text>
    <rect x="705" y="160" width="190" height="52" rx="10" fill="#ECEFF1"/><text x="800" y="193" text-anchor="middle" fill="#829AB1">Deshabilitado</text>
