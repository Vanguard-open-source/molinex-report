<path d="M 646 147 H 662 V 588 H 646" fill="none" stroke="#8296A8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline data-source="productionFeature qualityFeature maintenanceFeature intelligenceFeature commercialFeature reportingFeature identityFeature" data-target="frontendSharedKernel" class="dependency" points="662,261 722,261" marker-end="url(#arrow-dependency)"/>
