<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="676" viewBox="0 0 1140 676" role="img" aria-labelledby="title description">
<title id="title">Molinex Frontend · Component Overview</title>
<desc id="description">Angular features ordered by subdomain. Each of the seven feature components uses the two targets shown on the right.</desc>
<defs>
<marker id="arrow-link" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#326087"/></marker>
<marker id="arrow-dependency" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#795019"/></marker>
</defs>
<style>
text { fill: #17324D; font-family: Arial, Helvetica, sans-serif; }
.title { font-size: 29px; font-weight: 700; }
.subtitle { font-size: 16px; fill: #455B70; }
.boundary { fill: #FCFDFE; stroke: #8296A8; stroke-width: 1.6; stroke-dasharray: 7 5; }
.boundary-title { font-size: 16px; font-weight: 700; }
.node { font-size: 17px; font-weight: 700; }
.detail { font-size: 14px; fill: #3E546A; }
.edge-label { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: #FCFDFE; stroke-width: 5; stroke-linejoin: round; }
.link, .dependency { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.link { stroke: #326087; }
.dependency { stroke: #795019; stroke-dasharray: 6 4; }
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="25" y="38" class="title" text-anchor="start">Molinex Frontend · Component Overview</text>
<text x="26" y="64" class="subtitle" text-anchor="start">Angular features ordered by subdomain. Each of the seven feature components uses the two targets shown on the right.</text>
<rect x="229" y="88" width="686" height="552" rx="13" class="boundary"/>
<text x="246" y="112" class="boundary-title" text-anchor="start">Single-Page Application [Container · Angular 22 and TypeScript]</text>
<polyline data-source="productionOperator" data-target="productionFeature" class="link" points="218,199 242,199 242,167 278,167" marker-end="url(#arrow-link)"/>
