<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="592" viewBox="0 0 1240 592" role="img" aria-labelledby="title description">
<title id="title">Molinex Platform · Container Diagram</title>
<desc id="description">Public and operational entry points, the browser application, and the systems connected to the RESTful API.</desc>
<defs>
<marker id="arrow-link" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#326087"/></marker>
<marker id="arrow-dependency" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#795019"/></marker>
</defs>
<style>
text { fill: #17324D; font-family: Arial, Helvetica, sans-serif; }
.title { font-size: 29px; font-weight: 700; }
.subtitle { font-size: 16px; fill: #455B70; }
.boundary { fill: #FCFDFE; stroke: #8296A8; stroke-width: 1.6; stroke-dasharray: 7 5; }
.boundary-title { font-size: 16px; font-weight: 700; }
.node { font-size: 17px; font-weight: 700; }
.detail { font-size: 14px; fill: #3E546A; }
.edge-label { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: #FCFDFE; stroke-width: 5; stroke-linejoin: round; }
.link, .dependency { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.link { stroke: #326087; }
.dependency { stroke: #795019; stroke-dasharray: 6 4; }
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="25" y="38" class="title" text-anchor="start">Molinex Platform · Container Diagram</text>
<text x="26" y="64" class="subtitle" text-anchor="start">Public and operational entry points, the browser application, and the systems connected to the RESTful API.</text>
