<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="712" viewBox="0 0 1120 712" role="img" aria-labelledby="title description">
<title id="title">Molinex Backend · Component Overview</title>
<desc id="description">Business modules inside the Spring Boot API, the events they publish, and the production–quality Shared Kernel.</desc>
<defs>
<marker id="arrow-link" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#326087"/></marker>
<marker id="arrow-dependency" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#795019"/></marker>
</defs>
<style>
